<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SINGULAB.AI — Domain for Sale</title>
    <meta name="description" content="SINGULAB.AI is available for acquisition.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at center, #101820 0%, #06090c 45%, #020304 100%);

            color: #f4f7f8;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 760px;
            padding: 60px 20px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 40px;

            color: #7e9198;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #78f7d0;
            box-shadow: 0 0 12px rgba(120, 247, 208, 0.8);
        }

        h1 {
            font-size: clamp(42px, 9vw, 82px);
            font-weight: 300;
            letter-spacing: 0.08em;
            line-height: 1;

            margin-bottom: 26px;
        }

        h1 span {
            color: #78f7d0;
        }

        .line {
            width: 46px;
            height: 1px;
            background: #78f7d0;
            margin: 0 auto 28px;

            box-shadow: 0 0 10px rgba(120, 247, 208, 0.45);
        }

        .headline {
            color: #d8e0e3;
            font-size: 17px;
            font-weight: 400;
            letter-spacing: 0.06em;

            margin-bottom: 14px;
        }

        .description {
            max-width: 540px;
            margin: 0 auto 38px;

            color: #7f8d92;
            font-size: 14px;
            line-height: 1.8;
        }

        .contact {
            display: inline-block;

            padding: 14px 28px;

            border: 1px solid #29383d;
            border-radius: 3px;

            color: #dffcf3;
            text-decoration: none;

            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;

            transition: 0.25s ease;
        }

        .contact:hover {
            border-color: #78f7d0;
            background: rgba(120, 247, 208, 0.05);
            box-shadow: 0 0 28px rgba(120, 247, 208, 0.08);
        }

        .footer {
            position: fixed;
            bottom: 25px;
            left: 0;
            right: 0;

            color: #3f4a4e;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            h1 {
                letter-spacing: 0.04em;
            }

            .description {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="status">
            <span class="status-dot"></span>
            Available for acquisition
        </div>

        <h1>SINGULAB<span>.AI</span></h1>

        <div class="line"></div>

        <div class="headline">
            A premium domain for an ambitious AI venture.
        </div>

        <p class="description">
            SINGULAB.AI is privately owned and available for acquisition.
            Serious inquiries are welcome.
        </p>

        <a
            class="contact"
            href="mailto:imperialdynamics@gmail.com?subject=SINGULAB.AI%20Acquisition%20Inquiry">
            Contact Owner
        </a>

    </main>

    <div class="footer">
        SINGULAB.AI
    </div>

</body>
</html>
